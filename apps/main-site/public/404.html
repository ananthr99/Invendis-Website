<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>INVENDIS Technologies</title>
    <script>
      // GitHub Pages serves this file for any unknown path. It encodes the
      // requested path as a query string and redirects to the site root;
      // spa-redirect.js (loaded there) decodes it and restores the real
      // URL via history.replaceState, then React Router takes over.
      // segmentCount = 1 matches this repo's single GitHub Pages path
      // segment (adjust if the repo/base path ever changes).
      var segmentCount = 1;
      var l = window.location;
      var pathSegments = l.pathname.split('/').slice(1);
      var basePath = '/' + pathSegments.slice(0, segmentCount).join('/');
      var rest = pathSegments.slice(segmentCount).join('/');
      l.replace(
        basePath + '/?p=/' + rest.replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
